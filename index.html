<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@700;900&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Home page: built from the same pieces as planogram.html and decals.html
           (app-header, card, tokens from style.css). Only the tool links are new. */
        body.home-page .app-container {
            min-height: calc(100vh - 30px);
            min-height: calc(100dvh - 30px);
        }

        .home-subtitle {
            margin: -6px 0 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .tool-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        @media (min-width: 640px) {
            .tool-list { grid-template-columns: 1fr 1fr; }
        }

        .tool-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            text-decoration: none;
            color: var(--text-main);
            border: 1.5px solid transparent;
            transition: border-color 0.2s;
        }
        .tool-card:hover,
        .tool-card:focus-visible {
            border-color: var(--primary);
            outline: none;
        }

        .tool-icon {
            flex: 0 0 auto;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            background: rgba(83, 70, 224, 0.1);
            background: color-mix(in srgb, var(--primary) 12%, transparent);
        }
        .tool-icon svg { width: 22px; height: 22px; }

        .tool-text { flex: 1; min-width: 0; }
        .tool-title { margin: 0 0 3px; font-size: 16px; font-weight: 800; color: var(--text-main); }
        .tool-desc { margin: 0; font-size: 13px; line-height: 1.4; font-weight: 600; color: var(--text-muted); }

        .tool-arrow {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .tool-card:hover .tool-arrow,
        .tool-card:focus-visible .tool-arrow { color: var(--primary); }

        .home-footer {
            margin-top: auto;
            padding: 8px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }
    </style>
</head>
<body class="home-page" data-disclaimer="always">

<div class="app-container">

    <!-- Header (same as the other pages) -->
    <header class="app-header">
        <button type="button" class="settings-btn" onclick="openThemeModal()" title="Settings" aria-label="Settings">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </button>
        <h1 class="app-title">Store Tools</h1>
        <p class="home-subtitle">Shelf tags and decals, ready to print</p>
    </header>

    <!-- Tools -->
    <nav class="tool-list" aria-label="Tools">
        <a class="card tool-card" href="planogram.html">
            <span class="tool-icon" aria-hidden="true">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M3 9h18M3 15h18M9 3v18"/>
                </svg>
            </span>
            <div class="tool-text">
                <h2 class="tool-title">Planogram Maker</h2>
                <p class="tool-desc">Scan or search products to print shelf tags.</p>
            </div>
            <svg class="tool-arrow" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a class="card tool-card" href="decals.html">
            <span class="tool-icon" aria-hidden="true">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/>
                    <circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/>
                </svg>
            </span>
            <div class="tool-text">
                <h2 class="tool-title">Decals Maker</h2>
                <p class="tool-desc">Build promo decals and save them as a PDF.</p>
            </div>
            <svg class="tool-arrow" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
    </nav>

    <footer class="home-footer">This application was created by Mark Jake</footer>

</div>

<!-- Theme settings modal (same as the other pages) -->
<div id="themeModal" class="theme-modal">
    <div class="modal-content">
        <h3 style="margin-top:0; margin-bottom: 15px;">Choose Theme</h3>
        <div class="theme-options-grid">
            <button type="button" class="theme-btn theme-default" onclick="setTheme('default')">Default (Indigo)</button>
            <button type="button" class="theme-btn theme-teal-emerald" onclick="setTheme('teal-emerald')">Teal Emerald</button>
            <button type="button" class="theme-btn theme-warm-coral" onclick="setTheme('warm-coral')">Warm Coral</button>
            <button type="button" class="theme-btn theme-midnight-navy" onclick="setTheme('midnight-navy')">Midnight Navy</button>
            <button type="button" class="theme-btn theme-sunset" onclick="setTheme('sunset')">Sunset</button>
        </div>
        <button type="button" class="btn btn-danger-light" style="margin-top:20px;" onclick="closeThemeModal()">Close</button>
    </div>
</div>

<script src="disclaimer.js"></script>
<script>
    // Same theme logic and storage key as the other pages, so the theme carries across
    function openThemeModal() { document.getElementById("themeModal").style.display = "flex"; }
    function closeThemeModal() { document.getElementById("themeModal").style.display = "none"; }
    function setTheme(name) {
        try {
            if (name === 'default') { document.body.removeAttribute('data-theme'); localStorage.removeItem('appTheme'); }
            else { document.body.setAttribute('data-theme', name); localStorage.setItem('appTheme', name); }
        } catch (_) {}
        closeThemeModal();
    }
    (function () {
        try {
            const t = localStorage.getItem('appTheme');
            if (t) document.body.setAttribute('data-theme', t);
        } catch (_) {}
    })();
</script>
</body>
</html>
