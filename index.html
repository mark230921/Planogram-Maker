<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== Home page layout ===== */
        body.home-page .app-container {
            min-height: calc(100vh - 30px);
            min-height: calc(100dvh - 30px);
        }

        /* Header */
        .home-header { padding: 22px 20px 18px; }
        .home-badge {
            width: 52px; height: 52px; margin: 0 auto;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: var(--primary); color: #fff;
            box-shadow: 0 6px 14px -4px var(--primary);
        }
        .home-badge svg { width: 28px; height: 28px; }
        .home-subtitle { margin: 0; font-size: 13px; font-weight: 500; color: var(--text-muted); }

        /* Section label */
        .home-section-label {
            margin: 6px 4px -4px;
            font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--text-muted);
        }

        /* Tool cards */
        .tool-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 640px) { .tool-list { grid-template-columns: 1fr 1fr; } }

        .tool-card {
            display: flex; align-items: center; gap: 14px;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            text-decoration: none; color: var(--text-main);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        .tool-card:hover, .tool-card:focus-visible {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.25);
            outline: none;
        }
        .tool-card:active { transform: translateY(0); }

        .tool-icon {
            flex: 0 0 auto;
            width: 52px; height: 52px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(83, 70, 224, 0.12);
            background: color-mix(in srgb, var(--primary) 14%, transparent);
            color: var(--primary);
        }
        .tool-icon svg { width: 26px; height: 26px; }

        .tool-text { flex: 1; min-width: 0; text-align: left; }
        .tool-title { margin: 0 0 3px; font-size: 16px; font-weight: 800; color: var(--text-main); }
        .tool-desc  { margin: 0; font-size: 12.5px; line-height: 1.4; font-weight: 500; color: var(--text-muted); }

        .tool-arrow { flex: 0 0 auto; width: 20px; height: 20px; color: var(--text-muted); transition: transform 0.15s ease, color 0.15s ease; }
        .tool-card:hover .tool-arrow { transform: translateX(3px); color: var(--primary); }

        /* Footer */
        .home-footer {
            margin-top: auto; padding: 14px 8px 4px;
            text-align: center; font-size: 11px; font-weight: 500; line-height: 1.5;
            color: var(--text-muted);
        }
    </style>
</head>
<body class="home-page" data-disclaimer="always">

<div class="app-container">

    <!-- Header -->
    <header class="app-header home-header">
        <button type="button" class="settings-btn" onclick="openThemeModal()" title="Settings" aria-label="Settings">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </button>
        <div class="home-badge" aria-hidden="true">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M3 9l1.5-5h15L21 9"/>
                <path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>
                <path d="M5 12.5V20h14v-7.5"/>
                <path d="M10 20v-4.5h4V20"/>
            </svg>
        </div>
        <h1 class="app-title">Store Tools</h1>
        <p class="home-subtitle">Shelf tags &amp; decals made simple</p>
    </header>

    <!-- Tools -->
    <div class="home-section-label">Choose a tool</div>

    <nav class="tool-list" aria-label="Tools">
        <a class="tool-card" href="planogram.html">
            <span class="tool-icon" aria-hidden="true">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M3 9h18M3 15h18M9 3v18"/>
                </svg>
            </span>
            <div class="tool-text">
                <h2 class="tool-title">Planogram Maker</h2>
                <p class="tool-desc">Scan or search products to create and print shelf tags.</p>
            </div>
            <svg class="tool-arrow" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a class="tool-card" href="decals.html">
            <span class="tool-icon" aria-hidden="true">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/>
                    <circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/>
                </svg>
            </span>
            <div class="tool-text">
                <h2 class="tool-title">Decals Maker</h2>
                <p class="tool-desc">Build promo decals and save them as a ready-to-print PDF.</p>
            </div>
            <svg class="tool-arrow" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
    </nav>

    <!-- Footer -->
    <footer class="home-footer">
        This application was created by Mark Jake
    </footer>

</div>

<!-- Theme Settings Modal (same as other pages) -->
<div id="themeModal" class="theme-modal">
    <div class="modal-content">
        <h3 style="margin-top:0; margin-bottom: 15px;">Choose Theme</h3>
        <div class="theme-options-grid">
            <button type="button" class="theme-btn theme-default" onclick="setTheme('default')">Default (Indigo)</button>
            <button type="button" class="theme-btn theme-teal-emerald" onclick="setTheme('teal-emerald')">Teal Emerald</button>
            <button type="button" class="theme-btn theme-warm-coral" onclick="setTheme('warm-coral')">Warm Coral</button>
            <button type="button" class="theme-btn theme-midnight-navy" onclick="setTheme('midnight-navy')">Midnight Navy</button>
            <button type="button" class="theme-btn theme-sunset" onclick="setTheme('sunset')">Sunset</button>
        </div>
        <button type="button" class="btn btn-danger-light" style="margin-top:20px;" onclick="closeThemeModal()">Close</button>
    </div>
</div>

<script src="disclaimer.js"></script>
<script>
    // Same theme logic / storage key as script.js, so the theme carries across all pages
    function openThemeModal() { document.getElementById("themeModal").style.display = "flex"; }
    function closeThemeModal() { document.getElementById("themeModal").style.display = "none"; }
    function setTheme(name) {
        try {
            if (name === 'default') { document.body.removeAttribute('data-theme'); localStorage.removeItem('appTheme'); }
            else { document.body.setAttribute('data-theme', name); localStorage.setItem('appTheme', name); }
        } catch (_) {}
        closeThemeModal();
    }
    (function () {
        try {
            const t = localStorage.getItem('appTheme');
            if (t) document.body.setAttribute('data-theme', t);
        } catch (_) {}
    })();
</script>
</body>
</html>
